<nz-header class="dashboard-header">
  <div class="header-content">
    <!-- Left: Brand -->
    <div class="brand">
      <div class="brand-icon">
        <i nz-icon nzType="heart" nzTheme="fill"></i>
      </div>
      <div class="brand-text">
        <h1>Identidad Médica SOS</h1>
        <p>Panel familiar &middot; {{ user()?.displayName || 'Usuario' }}</p>
      </div>
    </div>

    <!-- Center: Navigation -->
    <nav class="header-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <i nz-icon nzType="appstore"></i> Perfiles
      </a>
      <a routerLink="/dashboard/family/studio" routerLinkActive="active" class="nav-item">
        <i nz-icon nzType="qrcode"></i> Estudio QR/NFC
      </a>
      <a routerLink="/dashboard/family/kit" routerLinkActive="active" class="nav-item">
        <i nz-icon nzType="printer"></i> Kit familiar
      </a>
    </nav>

    <!-- Right: Actions -->
    <div class="header-actions">
      <nz-badge nzDot class="notification-badge">
        <button nz-button nzType="text" nzShape="circle">
          <i nz-icon nzType="bell" nzTheme="outline"></i>
        </button>
      </nz-badge>
      
      <button nz-button nzType="primary" routerLink="/dashboard/family/editor/new" class="create-btn">
        <i nz-icon nzType="plus"></i> Crear Nuevo Perfil
      </button>

      <!-- User Dropdown -->
      <div class="user-menu-trigger" nz-dropdown nzTrigger="click" [nzDropdownMenu]="userMenu" nzPlacement="bottomRight">
        <nz-avatar [nzText]="user()?.displayName?.charAt(0) || 'U'" class="user-avatar"></nz-avatar>
        <div class="user-info-text">
          <span class="user-name">{{ user()?.displayName || 'Usuario' }}</span>
          <span class="user-role">Tutor</span>
        </div>
        <i nz-icon nzType="down" class="dropdown-icon"></i>
      </div>

      <nz-dropdown-menu #userMenu="nzDropdownMenu">
        <div class="user-dropdown-card">
          <div class="dropdown-header">
            <nz-avatar [nzText]="user()?.displayName?.charAt(0) || 'U'" nzSize="large" class="dropdown-avatar"></nz-avatar>
            <div class="dropdown-header-info">
              <h4>{{ user()?.displayName || 'Usuario' }}</h4>
              <p>{{ user()?.email || 'usuario@ejemplo.com' }}</p>
            </div>
          </div>
          <nz-divider style="margin: 0"></nz-divider>
          <ul nz-menu class="dropdown-list">
            <li nz-menu-item>
              <i nz-icon nzType="user"></i> Mi Perfil
            </li>
            <li nz-menu-item>
              <i nz-icon nzType="setting"></i> Configuración
            </li>
            <li nz-menu-divider></li>
            <li nz-menu-item nzDanger (click)="logout()">
              <i nz-icon nzType="logout"></i> Cerrar Sesión
            </li>
          </ul>
        </div>
      </nz-dropdown-menu>
    </div>
  </div>
</nz-header>
